name: Cowlib compatibility checks

on:
  push:
    branches: [compat/2.21]
  pull_request:
    branches: [compat/2.21]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Build strictly and run EUnit
        run: mise run ci
