[tools]
erlang = "28.5.0.8"
gitleaks = "8.30.1"

[tasks.ci]
depends = ["core:secrets"]
description = "Build strictly and run all EUnit tests"
run = "sh scripts/check.sh all"

[tasks."test:structured-fields"]
